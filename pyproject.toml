[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sim-bench"
version = "0.1.0"
description = "Simulate local LLM hardware (CPU, RAM, GPU) and models, estimate tokens/sec, and run a speed-matched mock server before you build."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llmsim = "llm_sim_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_sim_bench = ["device_calibration.json"]
