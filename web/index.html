<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Sim Bench</title>
  <meta name="description" data-i18n-attr="content:app.description" content="Simulate a local LLM rig before you build it: memory fit, tokens per second, and a speed-matched mock stream you can watch.">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div>
        <h1>LLM Sim Bench</h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
      <label class="lang-picker"><span data-i18n="lang.label">Language</span>
        <select id="lang"></select>
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="configs" id="configs" aria-label="Configurations" data-i18n-attr="aria-label:config.section"></section>

    <section class="panel mock" aria-labelledby="mock-title">
      <div class="mock-head">
        <h2 id="mock-title" data-i18n="mock.title"></h2>
        <div class="mock-controls">
          <label class="text-picker"><span data-i18n="mock.text"></span>
            <select id="text"></select>
          </label>
          <label><span data-i18n="mock.promptTokens"></span>
            <input id="prompt-tokens" type="number" min="1" max="200000" step="100" value="1000">
          </label>
          <label><span data-i18n="mock.outputTokens"></span>
            <input id="max-tokens" type="number" min="1" max="4000" step="50" value="300">
          </label>
          <button id="play" class="primary" type="button" data-i18n="mock.play"></button>
        </div>
      </div>
      <p class="credits" id="credits"></p>
      <p class="hint" data-i18n="mock.hint"></p>
      <div class="streams" id="streams"></div>
    </section>

    <section class="panel about" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="about.title"></h2>
      <ul>
        <li><strong data-i18n="about.memory.title"></strong>: <span data-i18n="about.memory.body"></span></li>
        <li><strong data-i18n="about.decode.title"></strong> <span data-i18n="about.decode.body"></span></li>
        <li><strong data-i18n="about.prefill.title"></strong> <span data-i18n="about.prefill.body"></span></li>
        <li><strong data-i18n="about.calibration.title"></strong>: <span data-i18n="about.calibration.body"></span> <span id="calibration"></span></li>
      </ul>
      <p class="hint" data-i18n="about.disclaimer"></p>
    </section>
  </main>

  <footer class="wrap site-footer">
    <span>LLM Sim Bench</span>
    <span><span data-i18n="footer.data"></span> <a href="https://github.com/ggml-org/llama.cpp/discussions/15013" data-i18n="footer.cuda"></a>, <a href="https://github.com/ggml-org/llama.cpp/discussions/4167" data-i18n="footer.apple"></a></span>
  </footer>
</body>
</html>
